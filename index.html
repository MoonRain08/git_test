<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calendar with Events</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <button id="prevBtn" class="nav-btn">← Previous</button>
            <h1 id="monthYear"></h1>
            <button id="nextBtn" class="nav-btn">Next →</button>
        </div>

        <div class="calendar">
            <div class="weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>
            <div class="days" id="calendarDays"></div>
        </div>
    </div>

    <!-- Event Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="eventModalTitle">Add Event</h2>
            
            <div class="form-group">
                <label for="eventInput">Event Name:</label>
                <input type="text" id="eventInput" placeholder="Enter event name..." maxlength="50">
            </div>

            <div class="form-group">
                <label for="eventTime">Time:</label>
                <input type="time" id="eventTime">
            </div>

            <div class="form-group">
                <label for="eventColor">Color:</label>
                <div class="color-picker">
                    <input type="radio" id="color-red" name="event-color" value="red" checked>
                    <label for="color-red" class="color-option color-red" title="Red"></label>
                    
                    <input type="radio" id="color-blue" name="event-color" value="blue">
                    <label for="color-blue" class="color-option color-blue" title="Blue"></label>
                    
                    <input type="radio" id="color-green" name="event-color" value="green">
                    <label for="color-green" class="color-option color-green" title="Green"></label>
                    
                    <input type="radio" id="color-purple" name="event-color" value="purple">
                    <label for="color-purple" class="color-option color-purple" title="Purple"></label>
                    
                    <input type="radio" id="color-yellow" name="event-color" value="yellow">
                    <label for="color-yellow" class="color-option color-yellow" title="Yellow"></label>
                    
                    <input type="radio" id="color-pink" name="event-color" value="pink">
                    <label for="color-pink" class="color-option color-pink" title="Pink"></label>
                </div>
            </div>

            <div class="modal-buttons">
                <button id="addEventBtn" class="btn btn-add">Add Event</button>
                <button id="cancelEventBtn" class="btn btn-cancel">Cancel</button>
            </div>
            
            <div id="eventsList" class="events-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
