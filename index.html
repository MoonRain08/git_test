<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calendar with Events</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <button id="prevBtn" class="nav-btn">← Previous</button>
            <h1 id="monthYear"></h1>
            <button id="nextBtn" class="nav-btn">Next →</button>
        </div>

        <div class="calendar">
            <div class="weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>
            <div class="days" id="calendarDays"></div>
        </div>
    </div>

    <!-- Event Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="eventModalTitle">Add Event</h2>
            <input type="text" id="eventInput" placeholder="Enter event name..." maxlength="50">
            <div class="modal-buttons">
                <button id="addEventBtn" class="btn btn-add">Add Event</button>
                <button id="cancelEventBtn" class="btn btn-cancel">Cancel</button>
            </div>
            <div id="eventsList" class="events-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
